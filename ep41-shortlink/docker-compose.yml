services:
  shortlink:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_DSN=root:pass@tcp(mysql:3306)/shortlink
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: shortlink
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
